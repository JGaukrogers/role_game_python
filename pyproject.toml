[project]
name = "role-game-python"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []


[tool.ruff]
line-length = 120


[tool.ruff.lint]
extend-select = [
    "ANN",
    "E",
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can change due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN201", # Missing return type -> Tests commonly return None (overkill)
    "ANN202", # Missing return type -> Tests commonly return None (overkill)
    "D102", # No docstrings -> not necessary in tests
]


[tool.ruff.format]
quote-style = "single"
